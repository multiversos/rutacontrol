<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f4a73" />
    <title>RutaControl Android</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background: #f5f8fb;
        color: #12314a;
      }

      main {
        width: min(100%, 430px);
        border: 1px solid rgba(15, 74, 115, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 52px rgba(15, 23, 42, 0.12);
        padding: 22px;
      }

      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #0f4a73;
        color: #fff;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        line-height: 1.55;
        margin: 0 0 12px;
      }

      .status {
        margin: 16px 0;
        border-radius: 8px;
        background: #eef6fb;
        padding: 12px;
        font-size: 0.94rem;
      }

      button,
      a {
        width: 100%;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid #0f4a73;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      button {
        background: #0f4a73;
        color: #fff;
      }

      a {
        margin-top: 10px;
        background: #fff;
        color: #0f4a73;
      }

      code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">RC</div>
      <h1>No pudimos cargar RutaControl</h1>
      <p>
        La app Android necesita conexion con la web movil. Revisa la red y
        vuelve a intentar.
      </p>
      <div class="status" id="status">
        Estado: esperando conexion con la app remota.
      </div>
      <button id="retry" type="button">Reintentar carga</button>
      <a href="https://rutacontrol.vercel.app/mobile">Abrir ruta movil</a>
      <p style="margin-top: 16px; font-size: 0.86rem; color: #526574">
        Para staging o desarrollo, sincroniza de nuevo con
        <code>CAPACITOR_SERVER_URL</code> apuntando a la URL correcta.
      </p>
    </main>

    <script>
      const remoteUrl = "https://rutacontrol.vercel.app/mobile";
      const status = document.querySelector("#status");
      const retry = document.querySelector("#retry");

      function setStatus(message) {
        status.textContent = `Estado: ${message}`;
      }

      function retryRemote() {
        if (!navigator.onLine) {
          setStatus("sin conexion en el dispositivo.");
          return;
        }

        setStatus("intentando cargar la app remota...");
        window.location.replace(remoteUrl);
      }

      retry.addEventListener("click", retryRemote);
      window.addEventListener("online", retryRemote);
      window.addEventListener("offline", () => {
        setStatus("sin conexion en el dispositivo.");
      });

      setStatus(
        navigator.onLine
          ? "la red esta disponible; toca Reintentar carga."
          : "sin conexion en el dispositivo.",
      );
    </script>
  </body>
</html>
